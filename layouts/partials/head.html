<head>
  {{ partial "meta" . }}

  <link
    rel="stylesheet"
    href="https://use.fontawesome.com/releases/v5.15.2/css/all.css"
    integrity="sha384-vSIIfh2YWi9wW0r9iZe7RJPrKwp6bG+s9QZMoITbCckVJqGCCRhc+ccxNcdpHuYu"
    crossorigin="anonymous"
  />

  <link
    rel="stylesheet"
    href="https://cdn.rawgit.com/jpswalsh/academicons/master/css/academicons.min.css"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Compiled Tailwind stylesheet -->
  <link rel="stylesheet" href="{{ `/css/site.css` | relURL }}" />

  <!-- Small custom overrides -->
  <link rel="stylesheet" href="{{ `/css/aafu.css` | relURL }}" />

  <script>
    let html = document.documentElement;
    let theme = window.localStorage.getItem("theme");

    if (theme === "dark") {
      html.classList.add("dark");
    } else {
      html.classList.remove("dark");
    }
    function lightDark(el) {
      const html = document.documentElement;

      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        localStorage.setItem("theme", "light");

        if (el) {
          el.classList.remove("fa-sun");
          el.classList.add("fa-moon");
        }
      } else {
        html.classList.add("dark");
        localStorage.setItem("theme", "dark");

        if (el) {
          el.classList.remove("fa-moon");
          el.classList.add("fa-sun");
        }
      }
    }
    window.onload = () => {
      let themeToggle = document.querySelector(".theme-toggle");

      if (themeToggle) {
        if (window.localStorage.getItem("theme") === "dark") {
          themeToggle.classList.remove("bi-moon-fill");
          themeToggle.classList.add("bi-brightness-high");
        } else {
          themeToggle.classList.add("bi-moon-fill");
          themeToggle.classList.remove("bi-brightness-high");
        }
      }

      let defaultActivePanel = document.querySelector(".accordion.active");

      if (defaultActivePanel && defaultActivePanel.nextElementSibling) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";
      }
    };

    window.onresize = () => {
      let defaultActivePanel = document.querySelector(".accordion.active");

      if (defaultActivePanel && defaultActivePanel.nextElementSibling) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";
      }
    };
  </script>
</head>
