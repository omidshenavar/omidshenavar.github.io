<header class="nav flex flex-row items-center py-2 mb-6 w-full border-b border-gray-300 dark:border-gray-700 justify-between">

  <div class="flex flex-row items-center">

    <button id="menu-toggle" class="md:hidden p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-800">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16">
        </path>
      </svg>
    </button>

    <div id="nav-links"
         class="hidden md:flex flex-row fixed md:static top-0 left-0 h-full w-64 bg-stone-50 dark:bg-darkest md:bg-transparent md:dark:bg-transparent transform -translate-x-full md:transform-none transition-transform duration-300 ease-in-out z-50">

      <div class="flex flex-col md:flex-row w-full">

        <button id="menu-close" class="md:hidden p-4 text-right">
          ✕
        </button>

        <a class="no-underline p-4 md:p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-800"
           href="/">
          Home
        </a>

        <a class="no-underline p-4 md:p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-800"
           href="/testimonials">
          Testimonials
        </a>

        <a class="no-underline p-4 md:p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-800"
           href="/apps">
          Apps
        </a>

      </div>
    </div>
  </div>

  <i class="fas fa-sun theme-toggle text-blue-500 hover:text-blue-700 dark:text-yellow-300 dark:hover:text-yellow-500 cursor-pointer text-lg"
     onclick="lightDark(this)">
  </i>

</header>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const menuToggle = document.getElementById("menu-toggle");
  const menuClose = document.getElementById("menu-close");
  const navLinks = document.getElementById("nav-links");

  if (!menuToggle || !menuClose || !navLinks) {
    return;
  }

  menuToggle.addEventListener("click", () => {
    navLinks.classList.remove("hidden");
    navLinks.classList.remove("-translate-x-full");
    navLinks.classList.add("translate-x-0");
  });

  menuClose.addEventListener("click", () => {
    navLinks.classList.remove("translate-x-0");
    navLinks.classList.add("-translate-x-full");

    setTimeout(() => {
      navLinks.classList.add("hidden");
    }, 300);
  });

  document.addEventListener("click", (e) => {
    if (
      window.innerWidth < 768 &&
      !navLinks.contains(e.target) &&
      !menuToggle.contains(e.target)
    ) {
      navLinks.classList.remove("translate-x-0");
      navLinks.classList.add("-translate-x-full");

      setTimeout(() => {
        navLinks.classList.add("hidden");
      }, 300);
    }
  });

});
</script>
