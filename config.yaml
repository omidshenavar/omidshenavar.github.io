      - degree: M.Sc. in Plant Pathology (Phytobacteriology)
        college: Sari Agricultural Sciences and Natural Resources University (SANRU), Iran
        dates: September 2014 - September 2017
        details: |
          Studied under Professor Heshmat Rahimian with a focus on plant pathogenic bacteria,
          particularly Xanthomonas species. Thesis research led to the description of a new
          pathovar on Primula vulgaris.
      - degree: B.Sc. in Plant Protection
