  aboutme:
    title: "About Me"
    icon: fas fa-microscope
    description: >
      I am a PhD student in Plant Pathology at the Federal University of
      Viçosa (UFV), Brazil. My research focuses on plant-associated bacteria,
      particularly species within the genus Xanthomonas, with interests in
      bacterial evolution and taxonomy.

      I am interested in learning, and am always trying to learn, sometime I can and sometimes I cannot; as all other human. However, I will never stop; I am Iranian, and I have already been through a lot. Failure is not an option for me.

